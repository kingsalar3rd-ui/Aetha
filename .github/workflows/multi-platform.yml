name: Build AETHA

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64

    steps:
      - uses: actions/checkout@v4

      - name: Build AETHA
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.config.target }}
          combine: true

  package:
    name: Package AETHA builds
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: AETHA-v0.1.0
          path: ${{ steps.build.outputs.build-output }}
